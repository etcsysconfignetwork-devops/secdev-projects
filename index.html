
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#080808">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta
        name="description"
        content="Xsports - Eventos deportivos en vivo"
    >

    <title>Xsports | Live Sports</title>

    <link rel="manifest" href="manifest.json">

    <!-- HLS Player -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.4/shaka-player.compiled.js"></script>

    <style>

        /* =========================================
           CONFIGURACIÓN GENERAL
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            color-scheme: dark;

            --red: #ff1010;
            --white: #ffffff;
            --black: #080808;
            --panel: #111111;
            --muted: #a5a5a5;
        }

        html,
        body {
            min-height: 100%;
            background: var(--black);
            color: var(--white);

            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Permitir escritura y selección en campos */

        input,
        textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 4px;
        }

        .hidden {
            display: none !important;
        }

        .screen {
            width: 100%;
            min-height: 100vh;
        }


        /* =========================================
           LOGIN
        ========================================= */

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px 16px;

            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    rgba(255, 0, 0, 0.12),
                    transparent 55%
                ),
                #050505;
        }

        /* PANEL PRINCIPAL */

        .login-box {
            position: relative;
            isolation: isolate;

            width: 100%;
            max-width: 390px;

            padding: 38px 30px;

            border-radius: 22px;

            background: #101010;

            overflow: hidden;

            box-shadow:
                0 0 25px rgba(255, 0, 0, 0.13),
                0 0 35px rgba(255, 255, 255, 0.07);
        }


        /* PROPIEDAD PARA ANIMACIÓN */

        @property --neon-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }


        /* BORDE NEÓN GIRATORIO */

        .login-box::before {
            content: "";

            position: absolute;
            z-index: -2;

            inset: -150%;

            background: conic-gradient(
                from var(--neon-angle),

                transparent 0deg,

                #ff0000 45deg,
                #ff3030 90deg,

                transparent 135deg,
                transparent 180deg,

                #ffffff 225deg,
                #ffffff 270deg,

                transparent 315deg,
                transparent 360deg
            );

            animation: neonRotate 5s linear infinite;

            filter: blur(5px);
        }


        /* INTERIOR OSCURO */

        .login-box::after {
            content: "";

            position: absolute;
            z-index: -1;

            inset: 2px;

            border-radius: 20px;

            background: #101010;
        }


        /* ANIMACIÓN */

        @keyframes neonRotate {

            from {
                --neon-angle: 0deg;
            }

            to {
                --neon-angle: 360deg;
            }

        }


        /* =========================================
           LOGOTIPO
        ========================================= */

        .logo-container {
            text-align: center;
            margin-bottom: 34px;
        }

        .logo-x {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 66px;
            height: 66px;

            margin: 0 auto 14px;

            border: 2px solid var(--red);
            border-radius: 18px;

            color: var(--white);

            font-size: 38px;
            font-weight: 900;

            background: #090909;

            box-shadow:
                0 0 12px rgba(255, 0, 0, 0.8),
                inset 0 0 12px rgba(255, 0, 0, 0.2);
        }

        .logo-container h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .logo-container p {
            margin-top: 7px;

            color: #ff3535;

            font-size: 12px;
            font-weight: bold;
            letter-spacing: 4px;

            text-transform: uppercase;
        }


        /* =========================================
           CAMPOS DE LOGIN
        ========================================= */

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;

            margin-bottom: 9px;

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;
        }

        .input-group input {
            display: block;

            width: 100%;
            min-height: 49px;

            padding: 12px 15px;

            border: 1px solid #444;
            border-radius: 9px;

            background: #080808;
            color: #ffffff;

            font-size: 15px;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .input-group input::placeholder {
            color: #888;
        }

        .input-group input:hover {
            border-color: #888;
        }

        .input-group input:focus {
            outline: none;

            border-color: var(--red);

            box-shadow:
                0 0 8px rgba(255, 0, 0, 0.5),
                0 0 15px rgba(255, 0, 0, 0.15);
        }


        /* =========================================
           BOTÓN INGRESAR
        ========================================= */

        .main-button {
            display: block;

            width: 100%;
            min-height: 50px;

            margin-top: 28px;

            border: 1px solid #ff3030;
            border-radius: 9px;

            background: linear-gradient(
                90deg,
                #c90000,
                #ff1717
            );

            color: #ffffff;

            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2px;

            box-shadow:
                0 0 12px rgba(255, 0, 0, 0.35);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .main-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 15px rgba(255, 0, 0, 0.65),
                0 0 28px rgba(255, 0, 0, 0.25);
        }

        .main-button:active {
            transform: scale(0.98);
        }

        .login-error {
            min-height: 20px;

            margin-top: 17px;

            color: #ff4545;

            font-size: 13px;
            text-align: center;
        }


        /* =========================================
           CATÁLOGO DE EVENTOS
        ========================================= */

        .events-screen {
            background: #080808;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            min-height: 70px;

            padding: 12px 25px;

            border-bottom: 1px solid #292929;

            background: #101010;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 7px;

            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .brand-x {
            color: var(--red);
            font-size: 32px;
        }

        .top-actions {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .install-button,
        .logout-button {
            min-height: 38px;

            padding: 9px 14px;

            border-radius: 7px;

            font-size: 11px;
            font-weight: bold;
        }

        .install-button {
            border: 1px solid #fff;

            background: #fff;
            color: #000;
        }

        .logout-button {
            border: 1px solid var(--red);

            background: transparent;
            color: white;
        }

        .logout-button:hover {
            background: var(--red);
        }

        .events-container {
            width: 100%;
            max-width: 1100px;

            margin: auto;

            padding: 35px 20px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 25px;
        }

        .section-title h2 {
            font-size: 23px;
        }

        #eventCounter {
            color: var(--muted);
            font-size: 13px;
        }

        .events-grid {
            display: grid;

            grid-template-columns: repeat(
                auto-fit,
                minmax(180px, 1fr)
            );

            gap: 15px;
        }


        /* =========================================
           REPRODUCTOR
        ========================================= */

        .player-screen {
            min-height: 100vh;

            padding: 15px;

            background: #050505;
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            max-width: 1200px;

            margin: 0 auto 15px;
        }

        .player-button {
            padding: 11px 16px;

            border: 1px solid var(--red);
            border-radius: 7px;

            background: #151515;
            color: #ffffff;

            font-size: 12px;
            font-weight: bold;
        }

        .player-button:hover {
            background: var(--red);
        }

        .player-title {
            font-size: 16px;
            font-weight: bold;
        }

        .video-container {
            position: relative;

            width: 100%;
            max-width: 1200px;

            margin: auto;

            aspect-ratio: 16 / 9;

            background: #000;
        }

        #videoPlayer {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;
        }

        .player-loading {
            position: absolute;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            gap: 15px;

            background: rgba(0, 0, 0, 0.75);

            color: #fff;

            font-size: 14px;

            pointer-events: none;
        }

        .spinner {
            width: 35px;
            height: 35px;

            border: 3px solid #555;
            border-top-color: var(--red);

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        .player-error {
            max-width: 1200px;

            margin: 15px auto;

            color: #ff4444;

            text-align: center;
        }


        /* =========================================
           AVISO DE DEVTOOLS
        ========================================= */

        .security-warning {
            position: fixed;
            z-index: 999999;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background: #050505;
            color: #ffffff;

            text-align: center;
        }

        .security-warning h2 {
            margin-bottom: 12px;

            color: var(--red);
        }

        .security-warning p {
            color: #cccccc;
            line-height: 1.6;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 600px) {

            .login-screen {
                padding: 20px 16px;
            }

            .login-box {
                max-width: 390px;
                padding: 32px 23px;
            }

            .logo-container h1 {
                font-size: 29px;
            }

            .top-bar {
                padding: 12px 14px;
            }

            .brand {
                font-size: 19px;
            }

            .top-actions {
                gap: 6px;
            }

            .install-button,
            .logout-button {
                padding: 9px 8px;
                font-size: 10px;
            }

            .events-container {
                padding: 25px 15px;
            }

            .section-title h2 {
                font-size: 19px;
            }

            .events-grid {
                grid-template-columns: repeat(
                    2,
                    minmax(0, 1fr)
                );

                gap: 10px;
            }

            .player-screen {
                padding: 10px;
            }

            .player-header {
                flex-wrap: wrap;
            }

            .video-container {
                aspect-ratio: 16 / 9;
            }

        }

        @media (max-width: 350px) {

            .login-box {
                padding: 27px 18px;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .brand {
                font-size: 17px;
            }

        }


        /* =========================================
           REDUCIR ANIMACIONES
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOGIN
    ========================================= -->

    <section
        id="loginScreen"
        class="screen login-screen"
    >

        <div class="login-box">

            <div class="logo-container">

                <div
                    class="logo-x"
                    aria-hidden="true"
                >
                    X
                </div>

                <h1>Xsports</h1>

                <p>Live Sports</p>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        placeholder="Ingrese su usuario"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Ingrese su contraseña"
                        required
                    >

                </div>


                <button
                    type="button"
                    id="loginButton"
                    class="main-button"
                >
                    INGRESAR
                </button>

            </form>


            <div
                id="loginError"
                class="login-error"
                role="alert"
                aria-live="polite"
            ></div>

        </div>

    </section>



    <!-- =========================================
         EVENTOS
    ========================================= -->

    <section
        id="eventsScreen"
        class="screen events-screen hidden"
    >

        <header class="top-bar">

            <div class="brand">

                <span class="brand-x">
                    X
                </span>

                <span>
                    sports
                </span>

            </div>


            <div class="top-actions">

                <button
                    id="installButton"
                    class="install-button hidden"
                    type="button"
                >
                    INSTALAR
                </button>


                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >
                    CERRAR SESIÓN
                </button>

            </div>

        </header>


        <main class="events-container">

            <div class="section-title">

                <h2>
                    Eventos en vivo
                </h2>

                <span id="eventCounter">
                    0 eventos
                </span>

            </div>


            <div
                id="eventsGrid"
                class="events-grid"
            ></div>

        </main>

    </section>



    <!-- =========================================
         REPRODUCTOR
    ========================================= -->

    <section
        id="playerScreen"
        class="player-screen hidden"
    >

        <div class="player-header">

            <button
                id="backButton"
                class="player-button"
                type="button"
            >
                ← EVENTOS
            </button>


            <div
                id="playerTitle"
                class="player-title"
            >
                Xsports
            </div>

        </div>


        <div class="video-container">

            <video
                id="videoPlayer"
                controls
                playsinline
                autoplay
            ></video>


            <div
                id="playerLoading"
                class="player-loading"
            >

                <div class="spinner"></div>

                <span>
                    Cargando transmisión...
                </span>

            </div>

        </div>


        <div
            id="playerError"
            class="player-error"
            role="alert"
        ></div>

    </section>



    <!-- =====================
