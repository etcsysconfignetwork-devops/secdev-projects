<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ff0000">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Xsports</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

    <!-- HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.4/shaka-player.compiled.js"></script>

</head>

<body>

<!-- =========================================================
     LOGIN
========================================================= -->

<section id="loginScreen" class="screen login-screen">

    <div class="login-box">

        <div class="logo-container">

            <div class="logo-x">
                X
            </div>

            <h1>Xsports</h1>

            <p>Live Sports</p>

        </div>

        <div class="input-group">

            <label for="username">
                Usuario
            </label>

            <input
                type="text"
                id="username"
                autocomplete="username"
                placeholder="Ingrese su usuario"
            >

        </div>

        <div class="input-group">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                placeholder="Ingrese su contraseña"
            >

        </div>

        <button
            id="loginButton"
            class="main-button"
        >
            INGRESAR
        </button>

        <div
            id="loginError"
            class="login-error"
        ></div>

    </div>

</section>


<!-- =========================================================
     EVENTOS
========================================================= -->

<section
    id="eventsScreen"
    class="screen events-screen hidden"
>

    <header class="top-bar">

        <div class="brand">

            <span class="brand-x">
                X
            </span>

            <span>
                sports
            </span>

        </div>

        <div class="top-actions">

            <button
                id="installButton"
                class="install-button hidden"
            >
                INSTALAR
            </button>

            <button
                id="logoutButton"
                class="logout-button"
            >
                CERRAR SESIÓN
            </button>

        </div>

    </header>


    <main class="events-container">

        <div class="section-title">

            <h2>
                Eventos en vivo
            </h2>

            <span id="eventCounter">
                0 eventos
            </span>

        </div>


        <div
            id="eventsGrid"
            class="events-grid"
        ></div>

    </main>

</section>


<!-- =========================================================
     REPRODUCTOR
========================================================= -->

<section
    id="playerScreen"
    class="player-screen hidden"
>

    <div class="player-header">

        <button
            id="backButton"
            class="player-button"
        >
            ← EVENTOS
        </button>

        <div
            id="playerTitle"
            class="player-title"
        >
            Xsports
        </div>

    </div>


    <div class="video-container">

        <video
            id="videoPlayer"
            controls
            playsinline
            autoplay
        ></video>

        <div
            id="playerLoading"
            class="player-loading"
        >

            <div class="spinner"></div>

            <span>
                Cargando transmisión...
            </span>

        </div>

    </div>


    <div
        id="playerError"
        class="player-error"
    ></div>

</section>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->


<!-- 🔐 XSPORTS - PROTECCIÓN AVANZADA -->
<script>
(() => {
  "use strict";

  // Evitar ejecución duplicada
  if (window.__xsportsSecurity) return;
  window.__xsportsSecurity = true;

  // 1. Bloquear menú contextual
  document.addEventListener("contextmenu", e => {
    e.preventDefault();
  });

  // 2. Bloquear selección de texto
  document.addEventListener("selectstart", e => {
    if (!e.target.closest("input, textarea")) {
      e.preventDefault();
    }
  });

  // 3. Bloquear arrastrar elementos
  document.addEventListener("dragstart", e => {
    e.preventDefault();
  });

  // 4. Bloquear atajos comunes de inspección
  document.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();

    const blocked =
      e.key === "F12" ||
      (e.ctrlKey && e.shiftKey &&
        ["i", "j", "c", "k"].includes(key)) ||
      (e.ctrlKey && ["u", "s"].includes(key)) ||
      (e.metaKey && e.altKey && ["i", "j", "c"].includes(key));

    if (blocked) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  // 5. Evitar impresión desde el navegador
  window.addEventListener("beforeprint", () => {
    document.body.classList.add("security-hidden");
  });

  window.addEventListener("afterprint", () => {
    document.body.classList.remove("security-hidden");
  });

  // 6. Protección visual ante impresión
  const style = document.createElement("style");
  style.textContent = `
    @media print {
      body {
        display: none !important;
      }
    }

    .security-hidden {
      visibility: hidden !important;
    }
  `;
  document.head.appendChild(style);

  // 7. Advertencia al detectar posibles DevTools
  let devtoolsDetected = false;

  setInterval(() => {
    const widthDiff =
      window.outerWidth - window.innerWidth;

    const heightDiff =
      window.outerHeight - window.innerHeight;

    const detected =
      widthDiff > 160 || heightDiff > 160;

    if (detected && !devtoolsDetected) {
      devtoolsDetected = true;
      console.warn("Xsports: herramientas de inspección detectadas.");
    }

    if (!detected) {
      devtoolsDetected = false;
    }
  }, 1500);

  // 8. Advertencia en consola
  console.log(
    "%cXsports",
    "color:red;font-size:35px;font-weight:bold;"
  );

  console.log(
    "%cAcceso restringido. No modifiques el código de la aplicación.",
    "color:white;background:black;font-size:14px;padding:8px;"
  );

})();
</script>


</body>

</html>
