
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ff0000">
    <meta name="description" content="Xsports - Eventos deportivos en vivo">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="referrer" content="no-referrer">

    <title>Xsports</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <!-- HLS -->
    <script
        src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"
        defer
    ></script>

    <!-- Shaka Player -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.4/shaka-player.compiled.js"
        defer
    ></script>

</head>

<body>

<!-- =========================================================
     LOGIN
========================================================= -->

<section
    id="loginScreen"
    class="screen login-screen"
>

    <div class="login-box">

        <div class="logo-container">

            <div class="logo-x">X</div>

            <h1>Xsports</h1>

            <p>Live Sports</p>

        </div>

        <div class="input-group">

            <label for="username">Usuario</label>

            <input
                type="text"
                id="username"
                autocomplete="username"
                placeholder="Ingrese su usuario"
                required
            >

        </div>

        <div class="input-group">

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                placeholder="Ingrese su contraseña"
                required
            >

        </div>

        <button
            id="loginButton"
            class="main-button"
            type="button"
        >
            INGRESAR
        </button>

        <div
            id="loginError"
            class="login-error"
            role="alert"
            aria-live="polite"
        ></div>

    </div>

</section>


<!-- =========================================================
     EVENTOS
========================================================= -->

<section
    id="eventsScreen"
    class="screen events-screen hidden"
>

    <header class="top-bar">

        <div class="brand">

            <span class="brand-x">X</span>

            <span>sports</span>

        </div>

        <div class="top-actions">

            <button
                id="installButton"
                class="install-button hidden"
                type="button"
            >
                INSTALAR
            </button>

            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                CERRAR SESIÓN
            </button>

        </div>

    </header>

    <main class="events-container">

        <div class="section-title">

            <h2>Eventos en vivo</h2>

            <span id="eventCounter">0 eventos</span>

        </div>

        <div
            id="eventsGrid"
            class="events-grid"
            aria-live="polite"
        ></div>

    </main>

</section>


<!-- =========================================================
     REPRODUCTOR
========================================================= -->

<section
    id="playerScreen"
    class="player-screen hidden"
>

    <div class="player-header">

        <button
            id="backButton"
            class="player-button"
            type="button"
        >
            ← EVENTOS
        </button>

        <div
            id="playerTitle"
            class="player-title"
        >
            Xsports
        </div>

    </div>

    <div class="video-container">

        <video
            id="videoPlayer"
            controls
            playsinline
            autoplay
            preload="metadata"
        ></video>

        <div
            id="playerLoading"
            class="player-loading"
            role="status"
            aria-live="polite"
        >

            <div class="spinner"></div>

            <span>Cargando transmisión...</span>

        </div>

    </div>

    <div
        id="playerError"
        class="player-error"
        role="alert"
        aria-live="assertive"
    ></div>

</section>


<!-- =========================================================
     PROTECCIÓN VISUAL
========================================================= -->

<script>
(() => {

    "use strict";

    if (window.__xsportsSecurity) return;

    window.__xsportsSecurity = true;

    // Bloquear menú contextual
    document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
    });

    // Bloquear selección fuera de campos de entrada
    document.addEventListener("selectstart", (event) => {

        if (
            event.target.closest(
                "input, textarea, [contenteditable='true']"
            )
        ) {
            return;
        }

        event.preventDefault();

    });

    // Bloquear arrastrar elementos
    document.addEventListener("dragstart", (event) => {
        event.preventDefault();
    });

    // Bloquear atajos comunes
    document.addEventListener("keydown", (event) => {

        const key = event.key.toLowerCase();

        const blocked =
            event.key === "F12" ||
            (
                event.ctrlKey &&
                event.shiftKey &&
                ["i", "j", "c", "k"].includes(key)
            ) ||
            (
                event.ctrlKey &&
                ["u", "s"].includes(key)
            ) ||
            (
                event.metaKey &&
                event.altKey &&
                ["i", "j", "c"].includes(key)
            );

        if (blocked) {

            event.preventDefault();
            event.stopImmediatePropagation();

        }

    }, true);

    // Protección de impresión
    const securityStyle = document.createElement("style");

    securityStyle.textContent = `
        @media print {
            body {
                display: none !important;
            }
        }
    `;

    document.head.appendChild(securityStyle);

    // Advertencia en consola
    console.log(
        "%cXsports",
        "color:#ff0000;font-size:35px;font-weight:bold;"
    );

    console.log(
        "%cAcceso restringido.",
        "color:white;background:black;font-size:14px;padding:8px;"
    );

})();
</script>


<!-- =========================================================
     SERVICE WORKER
========================================================= -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", async () => {

        try {

            await navigator.serviceWorker.register("./sw.js");

            console.log("Xsports: Service Worker registrado.");

        } catch (error) {

            console.error(
                "Xsports: Error al registrar Service Worker:",
                error
            );

        }

    });

}

</script>

<!-- =========================================================
     TU JAVASCRIPT PRINCIPAL
     Agregar aquí el script.js existente.
========================================================= -->

<script src="script.js" defer></script>

</body>
</html>
